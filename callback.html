<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https:;" />
  <title>Connecting your account...</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="onboard.css" />
</head>
<body>
  <main id="callback-page">
    <div class="callback-box glass">
      <p id="callback-status" aria-live="polite">Connecting your account...</p>
    </div>
  </main>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    (async () => {
      const LAMBDA_URL = 'https://f8rcwlcsz8.execute-api.us-east-1.amazonaws.com/prod/token';
      const status     = document.getElementById('callback-status');

      const params         = new URLSearchParams(location.search);
      const installationId = params.get('installation_id');

      if (!installationId) {
        status.textContent = 'Login failed — no installation ID received.';
        return;
      }

      // Exchange installation_id for access token via Lambda
      let tokenData;
      try {
        const res = await fetch(LAMBDA_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ installation_id: installationId }),
        });
        if (!res.ok) throw new Error(`Lambda returned ${res.status}`);
        tokenData = await res.json();
      } catch (e) {
        status.textContent = `Login failed — ${e.message}. Please try again.`;
        return;
      }

      // Fetch GitHub username
      let login;
      try {
        const res = await fetch('https://api.github.com/user', {
          headers: {
            Authorization: `token ${tokenData.token}`,
            Accept: 'application/vnd.github+json',
          },
        });
        if (!res.ok) throw new Error('Could not verify GitHub identity');
        ({ login } = await res.json());
      } catch (e) {
        status.textContent = e.message;
        return;
      }

      // Store session
      sessionStorage.setItem('autonom_token',       tokenData.token);
      sessionStorage.setItem('autonom_token_owner', login);

      status.textContent = 'Connected! Redirecting...';

      // If this was an onboarding flow, go back to index.html
      // If it was an existing site owner re-authing, go to their site
      const isOnboarding = sessionStorage.getItem('autonom_onboarding');
      setTimeout(() => {
        location.href = isOnboarding ? 'index.html' : `https://${login}.github.io`;
      }, 600);
    })();
  </script>
</body>
</html>
