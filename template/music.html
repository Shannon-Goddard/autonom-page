<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data: blob:; media-src 'self'; frame-src https://www.youtube.com; connect-src 'self' https://api.github.com https://f8rcwlcsz8.execute-api.us-east-1.amazonaws.com;" />
  <title>Music</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="theme.js"></script>

  <nav id="nav-drawer" aria-label="Site navigation"></nav>
  <button id="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">&#9776;</button>

  <main id="music-page">
    <h1>Music</h1>

    <div id="player" aria-label="Music player">
      <div id="track-info">
        <p id="track-title" aria-label="Track title"></p>
        <p id="track-artist" aria-label="Track artist"></p>
      </div>
      <audio id="audio-player" aria-label="Audio player"></audio>
      <div id="player-controls">
        <button id="prev-track" aria-label="Previous track">&#9664;&#9664;</button>
        <button id="play-pause" aria-label="Play or pause">Play</button>
        <button id="next-track" aria-label="Next track">&#9654;&#9654;</button>
        <div id="seek-row">
          <span id="time-current">0:00</span>
          <input type="range" id="seek-bar" value="0" aria-label="Seek" />
          <span id="time-total">0:00</span>
        </div>
        <div id="player-row2">
          <input type="range" id="volume" value="1" min="0" max="1" step="0.05" aria-label="Volume" />
          <button id="shuffle-btn" aria-label="Shuffle" title="Shuffle">&#x1F500;</button>
          <button id="repeat-btn" aria-label="Repeat" title="Repeat">&#x1F501;</button>
        </div>
      </div>
      <a id="download-track" aria-label="Download track">&#8681; Download</a>
    </div>

    <div id="track-filters" aria-label="Filter tracks">
      <select id="filter-playlist" aria-label="Filter by playlist"><option value="">All Playlists</option></select>
      <select id="filter-album"    aria-label="Filter by album"><option value="">All Albums</option></select>
      <select id="filter-artist"   aria-label="Filter by artist"><option value="">All Artists</option></select>
      <select id="sort-tracks"     aria-label="Sort tracks">
        <option value="default">Default Order</option>
        <option value="title">Title A–Z</option>
        <option value="artist">Artist A–Z</option>
        <option value="album">Album A–Z</option>
      </select>
    </div>

    <div id="track-list" aria-label="Track list"></div>

    <div id="upload-track-controls" class="hidden" aria-label="Upload track controls">
      <input type="file" id="track-upload" accept="audio/*" multiple aria-label="Upload audio files" />
      <button id="upload-track-btn" aria-label="Upload tracks">Upload Tracks</button>
    </div>
  </main>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="auth.js"></script>
  <script src="github-api.js"></script>
  <script src="feeds.js"></script>
  <script src="nav.js"></script>
  <script src="music.js"></script>
</body>
</html>
