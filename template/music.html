<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:; media-src 'self'; frame-src https://www.youtube.com;" />
  <title>Music</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="theme.js"></script>

  <nav id="nav-drawer" aria-label="Site navigation"></nav>
  <button id="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">&#9776;</button>

  <main id="music-page">
    <h1>Music</h1>

    <div id="player" aria-label="Music player">
      <div id="track-info">
        <p id="track-title" aria-label="Track title"></p>
        <p id="track-artist" aria-label="Track artist"></p>
      </div>
      <audio id="audio-player" aria-label="Audio player"></audio>
      <div id="player-controls">
        <button id="play-pause" aria-label="Play or pause">Play</button>
        <input type="range" id="seek-bar" value="0" aria-label="Seek" />
        <input type="range" id="volume" value="1" min="0" max="1" step="0.05" aria-label="Volume" />
      </div>
      <a id="download-track" aria-label="Download track">Download</a>
    </div>

    <div id="upload-track-controls" class="hidden" aria-label="Upload track controls">
      <input type="file" id="track-upload" accept="audio/mpeg" aria-label="Upload MP3" />
      <input type="text" id="track-title-input" placeholder="Track title" aria-label="Track title" />
      <input type="text" id="track-artist-input" placeholder="Artist name" aria-label="Artist name" />
      <button id="upload-track-btn" aria-label="Upload track">Upload Track</button>
    </div>
  </main>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="music.js"></script>
</body>
</html>
