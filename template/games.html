<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:; media-src 'self'; frame-src https://www.youtube.com;" />
  <title>Games</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="theme.js"></script>

  <nav id="nav-drawer" aria-label="Site navigation"></nav>
  <button id="nav-toggle" aria-label="Open navigation menu" aria-expanded="false">&#9776;</button>

  <main id="games-page">
    <h1>Games</h1>

    <div id="game-picker" aria-label="Game selection">
      <button class="game-tile" data-game="tetris" aria-label="Play Tetris">Tetris</button>
      <button class="game-tile" data-game="pacman" aria-label="Play Pac-Man">Pac-Man</button>
      <button class="game-tile" data-game="snake" aria-label="Play Snake">Snake</button>
      <button class="game-tile" data-game="breakout" aria-label="Play Breakout">Breakout</button>
      <button class="game-tile" data-game="spaceinvaders" aria-label="Play Space Invaders">Space Invaders</button>
    </div>

    <div id="game-viewport" aria-label="Game viewport">
      <canvas id="game-canvas" aria-label="Game canvas"></canvas>
      <button id="game-back" class="hidden" aria-label="Back to game picker">&#8592; Back</button>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="games/tetris.js"></script>
  <script src="games/pacman.js"></script>
  <script src="games/snake.js"></script>
  <script src="games/breakout.js"></script>
  <script src="games/spaceinvaders.js"></script>
  <script src="games.js"></script>
</body>
</html>
